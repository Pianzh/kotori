[package]
name = "kotori"
version = "0.1.0"
edition = "2024"
description = "Galgame manager with scaling and cloud sync for Linux (Niri/Wayland)"
authors = ["pzh"]

[dependencies]
# GUI
iced = { version = "0.13", features = ["tokio", "svg"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# IPC
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Config & Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
which = "7"
libc = "0.2"
nix = { version = "0.29", features = ["signal", "process"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
