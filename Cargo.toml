[package]
name = "kotori"
version = "0.1.0"
edition = "2024"
description = "Galgame manager with scaling and cloud sync for Linux (Niri/Wayland)"
authors = ["pzh"]

[dependencies]
# GUI. Slint renders the whole front end (ADR-018: "maximise the Windows 11
# resemblance" — WinUI 3 look, animations, and an IME that actually works under
# Wayland). The `.slint` sources live next to the Rust modules that drive them in
# `src/ui/slint/`; `build.rs` compiles them with the built-in `fluent` style.
slint = { version = "1.17", features = ["compat-1-2"] }
# Only for `KOTORI_UI_SNAPSHOT`: it writes a PNG of the window so the UI can be
# inspected without a screen (see `ui::snapshot`).
png = "0.17"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# IPC
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Config & Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
which = "7"
# 云同步的第一种引擎把一版存档打成一个 zip(见 HANDOVER.md 的同步一节)。
# 只开 deflate:默认特性会把 aes / bzip2 / zstd / lzma 的解码器全拖进来,而我们
# 既不加密也不读那些格式。选 zip 而不是 tar.gz 的理由很实在——**不装 kotori 的人
# 双击就能打开**,而这正是"云端是纯文件"这个承诺的最后一步。
zip = { version = "8", default-features = false, features = ["deflate"] }
libc = "0.2"
nix = { version = "0.29", features = ["signal", "process", "term"] }
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
futures-util = "0.3.34"

# Runtime scaling goes through the properties gamescope watches on the root window
# of its own Xwayland (see `src/scale/x11.rs`). Already in the tree as a transitive
# dependency of winit, so this adds nothing to build time.
x11rb = "0.13.2"

# 「浏览…」在 Linux 上的那一半:走桌面 portal(xdg-desktop-portal)。Windows 那边是
# 下面那个 rfd,二者由 `src/picker.rs` 的两个 `mod platform` 按平台分开。
#
# ⚠ 它**必须**待在 `cfg(unix)` 里,这不是洁癖:依赖写在通用段时,Windows 仍会去编
# ashpd **本身** —— 而它内部用了 `std::os::unix::ffi` 的 `OsStrExt`,于是 kotori
# 自己的代码**一行都没编到**就被它挡住了。2026-09-17 CI 首次实测:整个 job 报的
# 3 个错误全在 ashpd 里,一个都不在我们自己的代码里。
[target.'cfg(unix)'.dependencies]
ashpd = { version = "0.13.13", features = ["file_chooser", "tokio"] }

# 「浏览…」在 Windows 上的那一半:系统自己的「打开 / 选择文件夹」对话框 —— 就是资源
# 管理器弹出来的那个(shell 的 IFileOpenDialog)。**只在 Windows 上编译**,所以它不会
# 往 Linux 的依赖树里加任何东西:Linux 那边我们直接走 xdg-desktop-portal(见
# `src/picker.rs`),不引 rfd 的 GTK / portal 后端。
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }

# The GUI stack is unusably slow when compiled without optimisation: a renderer
# and a text shaper both do per-frame work, and at opt-level 0 a frame can take
# hundreds of milliseconds — the window then trails the keyboard by about a
# second, so typing or pasting looks like it "did not register". Optimise the
# dependencies even in debug builds; our own crate stays cheap to rebuild.
[profile.dev.package."*"]
opt-level = 3

# A little optimisation for kotori itself (the property bindings are re-evaluated
# on every change). Debug info and debug assertions are untouched, so debugging
# still works.
[profile.dev]
opt-level = 1

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[build-dependencies]
# Compiles `src/ui/slint/app.slint` (and everything it imports) into Rust.
slint-build = "1.17"

[dev-dependencies]
# Lets a unit test build the real window without a display (see the smoke test in
# `src/ui/render.rs`). Test-only: it is not linked into the binary.
i-slint-backend-testing = "1.17.1"
