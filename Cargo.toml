[package]
name = "kotori"
version = "0.1.0"
edition = "2024"
description = "Galgame manager with scaling and cloud sync for Linux (Niri/Wayland)"
authors = ["pzh"]

[dependencies]
# GUI
iced = { version = "0.13", features = ["tokio", "svg"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# IPC
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Config & Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
which = "7"
libc = "0.2"
nix = { version = "0.29", features = ["signal", "process", "term"] }
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
ashpd = { version = "0.13.13", features = ["global_shortcuts", "remote_desktop", "screencast", "tokio"] }
futures-util = "0.3.34"

# Runtime scaling goes through the properties gamescope watches on the root window
# of its own Xwayland (see `src/scale/x11.rs`). Already in the tree as a transitive
# dependency of winit, so this adds nothing to build time.
x11rb = "0.13.2"

# The GUI stack is unusably slow when compiled without optimisation: wgpu, naga
# and cosmic-text all do per-frame work, and at opt-level 0 a frame can take
# hundreds of milliseconds — the window then trails the keyboard by about a
# second, so typing or pasting looks like it "did not register". Optimise the
# dependencies even in debug builds; our own crate stays cheap to rebuild.
[profile.dev.package."*"]
opt-level = 3

# A little optimisation for kotori itself (the view tree is rebuilt per frame).
# Debug info and debug assertions are untouched, so debugging still works.
[profile.dev]
opt-level = 1

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
