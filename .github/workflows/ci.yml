# 构建与测试 —— 目标有四个:
#   ① 每次 push/PR 都在 x86_64 上跑一遍格式 / clippy / 全部测试;
#   ② 同一个 x86_64 job 接着**编出 Linux 交付产物**(tar.zst)并当 artifact 传上来 ——
#      Linux 的日常构建也走 CI:一个 debug `target/` 要三十来 G,不该成为"能不能出包"
#      的前提,"能装上去的那份"要有个不依赖某台开发机的来源;
#   ③ **在真的 aarch64 机器上**跑同一套测试(不是交叉编译);
#   ④ 在同一个 aarch64 job 里**编出交付产物**(tar.zst)并当 artifact 传上来 ——
#      ARM 设备的构建**一律在 CI 里做**,设备只负责跑(用户 2026-09-13)。
#
# 为什么不用交叉编译:Slint 官方文档给的路子是 `cross` + 自带系统库的容器,而
# **GitHub 现在给公开仓库免费提供 arm64 原生 runner**(`ubuntu-24.04-arm`)——
# 原生构建不用操心 sysroot/目标架构的 .so,而且能**真的把测试跑起来**,
# 交叉编译到 aarch64 只能编译、不能验证。
# https://github.blog/changelog/2025-08-07-arm64-hosted-runners-for-public-repositories-are-now-generally-available/
#
# ⚠ **产物只作为 artifact 上传,不打 Release**(用户 2026-09-13:"我们暂时不走 release,
#   纯 actions 构建")。产物里带了 `ldd` 与 glibc 版本:设备是滚动更新的 Arch,
#   而 runner 是 ubuntu-24.04(更新的系统装更旧的构建是安全方向,反过来才要命)。

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # ⚠ 测试**不许依赖 PATH 上的外部程序**(rclone / gamescope / wine / KWin)—— 它们一律
  # 通过 `KOTORI_RCLONE` 这类变量指向测试自己写的假货。第一次跑 ARM 时被咬过一次:
  # 一条讲"凭据文件重启后还在"的测试顺手断言了 `sync.status.ready`,而 `ready` 还要求
  # PATH 上有 rclone ⇒ 在 runner 上红得毫无道理(见 HANDOVER.md §9)。

jobs:
  # ── x86_64:格式、lint、全部测试 ─────────────────────────────────────────
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Slint 的 Linux 依赖(libxcb-shape0-dev 等)。缺了会在链接期才炸,别省。
      # zstd 是给下面打包用的(和 aarch64 那条同一个形状)。
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libfontconfig-dev libssl-dev zstd

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 格式
        run: cargo fmt --all --check

      - name: Clippy(零告警是硬规矩)
        run: cargo clippy --all-targets -- -D warnings

      - name: 测试
        run: scripts/test.sh

      # 交付物:Linux x86_64 的**日常构建**。一个 debug `target/` 三十来 G,所以"能不能
      # 出包"不该押在某台机器有没有编过 —— 推完就能从这里下载来验。
      # ⚠ 与 `test-arm` 同一个形状:strip + 自报家门的 BUILD-INFO(带 ldd 与 glibc)
      #   + tar.zst。产物带 ldd 的理由也一样:发行版比 runner 旧时,第一个问题永远
      #   是依赖和 glibc,让产物自己带着答案。
      - name: 构建 release
        run: cargo build --release --locked

      - name: 打包 x86_64 产物
        run: |
          set -euo pipefail
          name="kotori-x86_64-$(git rev-parse --short HEAD)"
          mkdir -p "dist/$name"
          strip target/release/kotori -o "dist/$name/kotori"
          install -m 644 assets/io.github.kotori.desktop "dist/$name/"
          install -m 644 LICENSE "dist/$name/"
          {
            echo "commit: $(git rev-parse HEAD)"
            echo "built:  $(date -u +%Y-%m-%dT%H:%M:%SZ)  (ubuntu-24.04 runner)"
            echo "rustc:  $(rustc --version)"
            echo "glibc:  $(ldd --version | head -1)"
            echo
            echo "== file dist/$name/kotori =="
            file "dist/$name/kotori"
            echo
            echo "== ldd target/release/kotori =="
            ldd target/release/kotori
          } > "dist/$name/BUILD-INFO.txt"
          tar -C dist -I 'zstd -19 -T0' -cf "dist/$name.tar.zst" "$name"
          ls -lh "dist/$name.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: kotori-linux-x86_64
          path: dist/*.tar.zst
          if-no-files-found: error
          # 每次 push 都出一个包,所以保留期短:够"推完就下载来验",又不至于把
          # artifact 一份份攒下去。要长期留的那份走 Release(见 release.yml)。
          retention-days: 7

  # ── Windows:编得过、零告警、测得过 ──────────────────────────────────────
  # 为什么先有这一步:这个仓库从来没有在 Windows 上编译过一次(此前 CI 里只有两个
  # ubuntu job),而代码里已经躺着若干 `#[cfg(windows)]` 分支 —— 从 picker 的
  # 文件对话框到 `NUL` 那个空设备。它们是否还编得过,没有任何人知道;而没有东西
  # 定期编译它们时,腐烂只是时间问题。
  #
  # ⚠ **首次运行预期是红的,红了才是它的价值** —— 失败清单就是待办清单。
  #   刻意不加 continue-on-error:那等于把这个 job 唯一的信号关掉。
  #   (那一轮已经过去了:Windows 侧现在是绿的。)
  #
  # windows-latest 是原生 Windows,自带 Rust 与 MSVC,不需要装任何系统依赖。
  # 测试直接 `cargo test --all-targets`(不走 `scripts/test.sh`:那个脚本是 bash +
  # `env -u DISPLAY` 的 Linux 形状,而这里没有 DISPLAY 可清)。e2e 那一套整条
  # `#![cfg(unix)]`(它建立在 Unix socket 上),在 Windows 上编成空 target,这是**设计如此**
  # ——"假装跑过了"比不跑更糟。
  #
  # ⚠ **为什么是 clippy 而不是 `cargo check`**(用户 2026-09-20):`#[cfg(windows)]`
  #   那些分支在 Linux 上**根本不参与编译**,所以"零告警"这条硬规矩在那边一直是空转的
  #   —— Windows 侧写出来的死代码、没用上的导入、写错了的 clippy 风格,只有原生这一遍
  #   才看得见。clippy 本来就跑 check 那一套,顺带把 lint 收了,代价为零。
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # 还编不过的那些轮,每一轮都要从零下载+编译(实测 10 分 25 秒)。默认失败
          # 不存缓存,而这个 job 存在的意义恰恰是"失败也要有产出",所以打开它:
          # 之后的迭代能降到几分钟。
          cache-on-failure: true

      - name: 编译 + lint(未使用的导入/变量、类型错误、clippy 风格一律不许过)
        # ⚠ `-A dead_code` 是**刻意**留的一个口子,理由是 Windows 上有一整块
        #   unix-only 的功能(`scale::args` 的阶梯算术、wineserver 收尾、
        #   `process::is_plumbing`……)在那边没有任何调用者,逐条 `#[cfg(unix)]`
        #   是另一件事(记在 PLATFORMS.md 的待办里)。这一条 lint 挡住的只是那些噪音,
        #   而**真正会被漏掉的东西**——`#[cfg(windows)]` 里写错的类型(实测抓到过
        #   `u32`/`i32`)、没人用的导入、clippy 的风格规则——照样全部拦下,这一遍
        #   第一次跑就抓出了 4 处(用户 2026-09-20:"你忘了在 ci 查告警了")。
        run: cargo clippy --all-targets --locked -- -D warnings -A dead_code

      - name: 测试(2026-09-21 在 VM 的 Windows 10 LTSC 上跑过:263 passed / 0 failed)
        # ⚠ 这一条是 2026-09-21 加的:在此之前 Windows 侧只有"编得过"一个信号,而
        #   单元测试里有一大堆平台相关的代码(进程表、exe 路径、kill_tree、空设备名、
        #   路径分隔符)只有在这边跑才算数。首次在 runner 上跑时盯一眼有没有环境差异。
        run: cargo test --all-targets --locked

  # ── aarch64:同一套测试,跑在真 ARM 上 ───────────────────────────────────
  # ⚠ 这一步只在**公开**仓库里免费(私有用 larger runner 才有 arm64)。
  #
  # ⚠ **只在手动触发或打 tag 时跑**(用户 2026-09-13:"arm 端不需要频繁构建"):
  #   2026-09-13 已经验过它能在原生 aarch64 上装依赖、编译、跑完 235 条单测
  #   (唯一失败是一条与本平台无关的断言,已修),所以没必要每次 push 都占一台 runner。
  #   要跑:GitHub 上 Actions → CI → Run workflow,或者 `gh workflow run ci.yml`。
  test-arm:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # zstd 用来把产物压成 tar.zst(设备上解包快、体积小),strip 来自 binutils。
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libfontconfig-dev libssl-dev zstd

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ⚠ 测试跑在 **release** profile 上:这样"测过的那份"就是"要发的那份",
      # 而且下面的 release 构建已经热乎(debug + release 各编一遍依赖是双倍等待;
      # 用户 2026-09-13:"先在 action 编译,节省中间时间")。
      - name: 测试(原生 aarch64,release profile,不是交叉编译)
        run: scripts/test.sh --release --locked

      # 交付物:ARM64 是主交付目标(见 HANDOVER.md §2.2)。真机那一步(游戏真的在 ARM 上
      # 跑起来)只有设备在手时才算验完 —— 这里只负责"编得出来、测过得去、装得下去"。
      - name: 构建 release
        run: cargo build --release --locked

      - name: 打包 ARM64 产物
        run: |
          set -euo pipefail
          name="kotori-aarch64-$(git rev-parse --short HEAD)"
          mkdir -p "dist/$name"
          strip target/release/kotori -o "dist/$name/kotori"
          install -m 644 assets/io.github.kotori.desktop "dist/$name/"
          install -m 644 LICENSE "dist/$name/"
          # 设备上"跑不起来"的第一个问题永远是依赖和 glibc,所以让产物自己带着答案。
          {
            echo "commit: $(git rev-parse HEAD)"
            echo "built:  $(date -u +%Y-%m-%dT%H:%M:%SZ)  (ubuntu-24.04-arm runner)"
            echo "rustc:  $(rustc --version)"
            echo "glibc:  $(ldd --version | head -1)"
            echo
            echo "== file dist/$name/kotori =="
            file "dist/$name/kotori"
            echo
            echo "== ldd target/release/kotori =="
            ldd target/release/kotori
          } > "dist/$name/BUILD-INFO.txt"
          tar -C dist -I 'zstd -19 -T0' -cf "dist/$name.tar.zst" "$name"
          ls -lh "dist/$name.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: kotori-aarch64
          path: dist/*.tar.zst
          if-no-files-found: error
          retention-days: 30
